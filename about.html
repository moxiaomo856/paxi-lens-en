  document.getElementById('legalBody').innerHTML = LEGAL[lc];
  document.getElementById('pageTitle').textContent = (PAGE_TITLES[lc] || PAGE_TITLES.en);
  document.getElementById('backLink').textContent = (BACK_TEXT[lc] || BACK_TEXT.en);
  const sel = document.getElementById('langSel');
  if (sel) sel.value = lc;
